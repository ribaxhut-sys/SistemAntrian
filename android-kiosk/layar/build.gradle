plugins {
    id "com.android.application"
}

// Layar antrian untuk panel Android Maxtor, tegak atau mendatar (docs/istilah.md).
// Aplikasi terpisah dari anjungan: satu perangkat, satu tugas.
android {
    namespace "id.sistemantrian.layar"
    compileSdk 35

    defaultConfig {
        applicationId "id.sistemantrian.layar"
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName "1.7"
    }
}
