plugins {
    id "com.android.application"
}

// Layar antrian untuk TV Android (docs/istilah.md). Aplikasi terpisah dari
// anjungan: satu perangkat, satu tugas.
android {
    namespace "id.sistemantrian.layar"
    compileSdk 35

    defaultConfig {
        applicationId "id.sistemantrian.layar"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
}
